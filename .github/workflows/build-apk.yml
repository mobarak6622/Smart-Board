name: Build & Release SmartBoard Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Debug Signing Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare APK for Download
        run: |
          mkdir -p release-apk
          if [ -f ".build-outputs/app-debug.apk" ]; then
            cp .build-outputs/app-debug.apk release-apk/SmartBoard-Pro.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/SmartBoard-Pro.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartBoard-Pro-APK
          path: release-apk/SmartBoard-Pro.apk

      - name: Publish APK to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SmartBoard Pro Latest APK
          body: |
            ### SmartBoard Pro — Digital Teaching Whiteboard & Live Classroom (Android APK)
            - **Direct APK Download**: Download `SmartBoard-Pro.apk` below and install on your Android phone or tablet.
            - **Bilingual Support**: বাংলা (Bengali) & English.
          files: release-apk/SmartBoard-Pro.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
