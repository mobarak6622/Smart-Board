name: Build & Release SmartBoard Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Prebuilt APK as Workflow Artifact
        if: hashFiles('apk/SmartBoard-Pro.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SmartBoard-Pro-APK
          path: apk/SmartBoard-Pro.apk

      - name: Publish APK to GitHub Releases (Latest)
        if: hashFiles('apk/SmartBoard-Pro.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SmartBoard Pro Latest APK
          body: |
            ### SmartBoard Pro — Digital Teaching Whiteboard & Live Classroom (Android APK)
            - **Direct APK Download**: Download `SmartBoard-Pro.apk` below and install on your Android phone or tablet.
            - **Bilingual Support**: বাংলা (Bengali) & English.
          files: apk/SmartBoard-Pro.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
